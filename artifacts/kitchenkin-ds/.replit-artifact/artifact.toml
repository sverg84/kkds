kind = "design-system"
previewPath = "/kitchenkin-ds/"
title = "KitchenKin Design System"
version = "1.0.0"
id = "artifacts/kitchenkin-ds"
router = "path"

[[services]]
name = "web"
paths = [ "/kitchenkin-ds/" ]
localPort = 20227

[services.development]
run = "pnpm --filter @sverg84/kkds run dev"

[services.env]
PORT = "20227"
BASE_PATH = "/kitchenkin-ds/"

[services.production]
serve = "static"
publicDir = "artifacts/kitchenkin-ds/dist"

[services.production.build]
args = ["pnpm", "--filter", "@sverg84/kkds", "run", "build:preview"]

[services.production.build.env]
NODE_ENV = "production"
PORT = "20227"
BASE_PATH = "/kitchenkin-ds/"
