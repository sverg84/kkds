<!DOCTYPE html>
<!--
  Preview entry for the KitchenKin Design System.
  Fonts loaded as non-blocking <link> tags (not CSS @import, which is
  render-blocking). Trimmed to the families the tokens use:
    sans  → Spline Sans (KitchenKin primary)
    serif → Georgia (system)
    mono  → system monospace stack
-->
<html lang="en" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>KitchenKin Design System</title>
    <meta name="description" content="KitchenKin Design System — warm, food-forward component library and token reference." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"></noscript>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
